spring:
  application:
    name: anything-server
  # Default: H2 file database in PostgreSQL mode, stored in server/data/.
  # No Docker or database install needed for local development.
  datasource:
    url: jdbc:h2:file:./data/anything;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

---
# Real PostgreSQL (Docker or deploy). Run with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/anything
    username: anything
    password: anything

---
# On the internet (Render). Set SPRING_PROFILES_ACTIVE=prod and DATABASE_URL.
# The database itself is set up in config/ProductionDatabaseConfig.java.
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: off
  jmx:
    enabled: false          # nothing reads the JMX beans; registering them isn't free
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred   # repositories finish in the background, not in the critical path
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect   # saves asking the database what it is

server:
  port: ${PORT:8080}                     # Render tells the app which port to listen on
  forward-headers-strategy: framework    # it sits behind Render's HTTPS proxy
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,text/plain,application/manifest+json
  shutdown: graceful
